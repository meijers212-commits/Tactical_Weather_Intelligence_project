apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-c-deploy
  labels:
    app: service-c
spec:
  replicas: 3
  selector:
    matchLabels:
      app: service-c
  template:
    metadata:
      labels:
        app: service-c
    spec:
      containers:
      - name: nginx
        image: elazarmeijers/api-service-c:v1
        ports:
        - containerPort: 8081